<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouTube This or That</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@700&family=Nunito:wght@700&display=swap"
    rel="stylesheet"
  />
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="sparkle-canvas" aria-hidden="true"></canvas>

  <video id="webcam" autoplay playsinline muted></video>

  <header class="topbar">
  <div class="nav-left">
    <img src="images/youtubeicon.svg" alt="" class="nav-svg nav-youtube-icon" />
    <span class="nav-label">Home</span>
  </div>

  <div class="nav-center">
  <button class="logo-refresh-btn" id="refreshPageBtn" type="button" aria-label="Refresh page">
    <img src="images/youtubethisorthatlogo.svg" alt="YouTube This or That" class="nav-logo-svg" />
  </button>
</div>

  <div class="nav-right">
    <span id="clock">17:11</span>
    <a class="nav-btn about-link" href="about.html">About</a>
    <button class="icon-btn" id="soundToggle" type="button" aria-label="Toggle sound">
      <img src="images/soundonicon.svg" alt="" class="nav-svg nav-sound-icon" id="soundIconImg" />
    </button>
  </div>
</header>

  <main class="page">
    <section class="choices-wrap">
      <article class="choice-card" id="leftCard" data-side="left">
        <div class="thumb-wrap">
          <img id="leftThumb" alt="Left video thumbnail" />
          <span class="video-time" id="leftDuration">--:--</span>
        </div>
        <h2 class="video-title" id="leftTitle">Loading...</h2>
      </article>

      <div class="center-play" aria-hidden="true"></div>

      <article class="choice-card" id="rightCard" data-side="right">
        <div class="thumb-wrap">
          <img id="rightThumb" alt="Right video thumbnail" />
          <span class="video-time" id="rightDuration">--:--</span>
        </div>
        <h2 class="video-title" id="rightTitle">Loading...</h2>
      </article>
    </section>

    <section class="status-area">
      <p id="instruction">Loading trending videos and starting camera...</p>
      <div class="tilt-meter">
        <div class="tilt-dot" id="tiltDot"></div>
      </div>
    </section>
  </main>

  <footer class="bottom-icons">
  <button class="icon-btn" id="screenshotBtn" type="button" aria-label="Screenshot">
    <img src="images/screencaptureicon.svg" alt="" class="bottom-svg bottom-camera-icon" />
  </button>

  <button class="icon-btn" type="button" aria-label="Share">
    <img src="images/shareicon.svg" alt="" class="bottom-svg bottom-share-icon" />
  </button>
</footer>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
